<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<!--
  Experimental stimulus. One shell, three contexts, two screens:
    ?relation=1  dating (default)               ?relation=0  freelancer hiring
    ?relation=2  online language (Spanish) tutoring
    ?DH=0        profile screen (default)       ?DH=1        digital avatar screen
    ?review=0    avatar built from uploaded content with consent (default)
    ?review=1    adds: the person reviewed and verified the avatar
  Only the PERSON block in the script differs between ethan/olivia/john.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #1C1917; --body: #292524; --muted: #57534E;
    --border: #E7E5E4; --surface: #F5F5F4; --photo: #EDEBE9;
    --band: #FAFAF9; --video: #DEDBD8;
  }
  html, body { background: #FFFFFF; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--body); -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  svg { display: block; }

  .frame { width: 390px; max-width: 100%; min-height: 100vh; margin: 0 auto; background: #FFFFFF; display: flex; flex-direction: column; }

  .app-header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; border-bottom: 1px solid var(--border); }
  .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .app-name { font-size: 15px; font-weight: 600; color: var(--ink); text-align: center; flex: 1; }

  .photo { height: 360px; background: var(--photo); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; }

  .name-block { padding: 20px 20px 0; }
  .name-block h1 { font-size: 24px; font-weight: 600; line-height: 1.25; color: var(--ink); }
  .subtitle { font-size: 13px; line-height: 1.4; color: var(--muted); margin-top: 4px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 20px 0; list-style: none; }
  .chip { font-size: 12px; line-height: 1.3; padding: 6px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; color: var(--body); }

  .section { padding: 24px 20px 0; }
  .section-heading { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
  .about-text { font-size: 14px; line-height: 1.6; color: var(--body); }

  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .card-label { font-size: 12px; font-weight: 600; line-height: 1.4; color: var(--muted); }
  .card-body { font-size: 14px; line-height: 1.5; color: var(--body); margin-top: 4px; }

  .content-end { height: 28px; }

  main[hidden] { display: none; }
  .identity { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .identity img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; object-position: center 30%; background: var(--photo); flex-shrink: 0; }
  .identity-name { font-size: 17px; font-weight: 600; line-height: 1.3; color: var(--ink); }
  .identity .subtitle { margin-top: 2px; }
  .avatar-band { background: var(--band); border-bottom: 1px solid var(--border); padding: 20px; }
  .avatar-heading { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--ink); }
  .avatar-heading h2 { margin: 0; }
  .video { position: relative; height: 230px; border-radius: 12px; background: var(--video); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); }
  .video-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .video-note { font-size: 12px; color: var(--muted); }
  .self-view { position: absolute; right: 10px; bottom: 10px; width: 74px; height: 54px; border-radius: 8px; background: #C9C5C1; border: 1px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--body); }
  .call-controls { display: flex; justify-content: center; gap: 16px; margin-top: 14px; }
  .round-btn { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid var(--border); color: var(--ink); }
  .round-btn.end { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
  .disclosure { font-size: 12px; line-height: 1.6; color: var(--muted); margin-top: 16px; }
  .try-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-top: 16px; margin-bottom: 8px; }
  .suggestions { display: flex; flex-direction: column; gap: 8px; }
  .suggestion { width: 100%; text-align: left; font-size: 13px; line-height: 1.4; padding: 10px 14px; background: #FFFFFF; border: 1px solid var(--border); border-radius: 999px; color: var(--body); }

  .cta-bar { margin-top: auto; display: flex; gap: 12px; padding: 16px 20px; border-top: 1px solid var(--border); background: #FFFFFF; }
  .cta-secondary { width: 56px; height: 48px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--border); background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .cta-primary { flex: 1; height: 48px; border-radius: 12px; background: #1C1917; color: #FFFFFF; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<div class="frame" id="frame">

  <header class="app-header">
    <button type="button" class="icon-btn" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="app-name" id="appName"></span>
    <button type="button" class="icon-btn" aria-label="More options">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
    </button>
  </header>

  <main id="profilePage">
    <div class="photo"><img id="photo" alt=""></div>

    <section class="name-block" aria-labelledby="profileName">
      <h1 id="profileName"></h1>
      <p class="subtitle" id="subtitle"></p>
    </section>

    <ul class="chips" id="chips"></ul>

    <section class="section" aria-labelledby="aboutHeading">
      <h2 class="section-heading" id="aboutHeading"></h2>
      <p class="about-text" id="aboutText"></p>
    </section>

    <section class="section" aria-labelledby="detailHeading">
      <h2 class="section-heading" id="detailHeading"></h2>
      <div class="cards" id="cards"></div>
    </section>

    <div class="content-end"></div>
  </main>

  <main id="avatarPage" hidden>
    <section class="identity" aria-labelledby="avatarName">
      <img id="avatarThumb" alt="">
      <div>
        <h1 class="identity-name" id="avatarName"></h1>
        <p class="subtitle" id="avatarSubtitle"></p>
      </div>
    </section>

    <section class="avatar-band" aria-labelledby="avatarHeading">
      <div class="avatar-heading">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        <h2 class="section-heading" id="avatarHeading" style="margin-bottom:0;">Digital avatar</h2>
      </div>
      <div class="video">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <span class="video-label" id="videoLabel"></span>
        <span class="video-note">[ same build in all contexts ]</span>
        <div class="self-view">You</div>
      </div>
      <div class="call-controls">
        <button type="button" class="round-btn" aria-label="Mute microphone">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>
        </button>
        <button type="button" class="round-btn end" aria-label="End conversation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="disclosure" id="disclosure"></p>
      <p class="try-label">Try asking</p>
      <div class="suggestions" id="suggestions"></div>
    </section>
  </main>

  <div class="cta-bar">
    <button type="button" class="cta-secondary" id="ctaSecondary"></button>
    <button type="button" class="cta-primary" id="ctaPrimary"></button>
  </div>

</div>

<script>
  /* ===== PERSON (the only block that differs between files) ===== */
  const PERSON = {
    photo: '../ethan/ethan_photo.jpg',
    first: 'Alex',
    dating: {
      app: 'Linden',
      name: 'Alex, 32',
      subtitle: 'Chicago, IL · 4 miles away',
      chips: ['6\'0"', 'Non-smoker', 'Social drinker', 'Has a dog', 'Wants kids'],
      aboutHeading: 'About me',
      about: 'I grew up in Michigan and moved here for work six years ago. Weekends are usually a long run along the lake, a used bookstore, or talking friends into a jazz show. I am steady, a little stubborn, and I would rather have one real conversation than five polite ones.',
      detailHeading: 'A few things about me',
      cards: [
        ['The way to win me over', 'Order the thing you actually want, not the thing that is easy to split.'],
        ['I am looking for', 'Someone I can be quiet around. I would like this to turn into something long-term.'],
        ['My simple pleasures', 'Vinyl at 7am, cold weather, and the first twenty minutes of a long drive.']
      ],
      questions: ['What do you do on weekends?', 'What are you looking for?', 'Tell me about where you grew up.']
    },
    freelance: {
      app: 'Tasklane',
      name: 'Alex R.',
      subtitle: 'Brand & web designer · Chicago, IL',
      chips: ['7 yrs experience', '$65/hr', 'Figma', 'Webflow', 'Available now'],
      aboutHeading: 'About my work',
      about: 'I trained in Michigan and have been freelancing here for six years. Most of my work is brand identity and marketing sites for small teams. I start with a short discovery call, send a first direction within a week, and keep one shared file so clients can see exactly where things stand.',
      detailHeading: 'Selected work',
      cards: [
        ['Rebrand · Regional coffee roaster', 'Identity, packaging, and a five-page site. Six weeks from start to launch.'],
        ['Marketing site · B2B software', 'Design and build in Webflow, handed off with a component library.'],
        ['Campaign assets · Nonprofit', 'Print and social set for a year-end fundraising push.']
      ],
      questions: ['How do you usually start a project?', 'Tell me about the coffee roaster rebrand.', 'What is your availability?']
    },
    tutoring: {
      app: 'Talkwell',
      name: 'Alex R.',
      subtitle: 'Spanish tutor · Chicago, IL',
      chips: ['7 yrs teaching', '$40/lesson', 'Conversation', 'Beginner friendly', 'Available now'],
      aboutHeading: 'About my lessons',
      about: 'I grew up in Michigan speaking Spanish at home and have been tutoring online for six years. Most of my students are adults who know some basics but freeze up in real conversation. I start with a short trial lesson, set one goal within the first week, and keep one shared doc so students can see exactly what they have picked up.',
      detailHeading: 'How lessons work',
      cards: [
        ['Trial lesson · 30 min', 'We talk through your goals, I check your level, and we pick one thing to focus on first.'],
        ['Weekly lesson · 50 min', 'Conversation practice around everyday situations, with short grammar notes as they come up.'],
        ['Between lessons', 'A short list of phrases from our lesson to practice before next time.']
      ],
      questions: ['How do you usually start with a new student?', 'What is a weekly lesson like?', 'What is your availability?']
    }
  };
  /* ===== end PERSON ===== */

  const ICONS = {
    pass: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>',
    save: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'
  };

  const params = new URLSearchParams(location.search);
  const getParam = k => params.get(k) ?? params.get(k.toLowerCase()) ?? params.get(k.toUpperCase());
  const relation = ['0', '2'].includes(getParam('relation')) ? getParam('relation') : '1';
  const isDating = relation === '1';
  const showAvatar = getParam('DH') === '1';
  const reviewed = getParam('review') === '1';
  const c = { '0': PERSON.freelance, '1': PERSON.dating, '2': PERSON.tutoring }[relation];
  const $ = id => document.getElementById(id);

  document.title = c.app;
  document.body.dataset.relation = relation;
  document.body.dataset.dh = showAvatar ? '1' : '0';
  document.body.dataset.review = reviewed ? '1' : '0';

  $('appName').textContent = c.app;
  $('photo').src = PERSON.photo;
  $('photo').alt = 'Profile photo of ' + PERSON.first;
  $('profileName').textContent = c.name;
  $('subtitle').textContent = c.subtitle;
  c.chips.forEach(t => { const li = document.createElement('li'); li.className = 'chip'; li.textContent = t; $('chips').appendChild(li); });
  $('aboutHeading').textContent = c.aboutHeading;
  $('aboutText').textContent = c.about;
  $('detailHeading').textContent = c.detailHeading;
  c.cards.forEach(([label, body]) => {
    const card = document.createElement('div'); card.className = 'card';
    const l = document.createElement('p'); l.className = 'card-label'; l.textContent = label;
    const b = document.createElement('p'); b.className = 'card-body'; b.textContent = body;
    card.append(l, b); $('cards').appendChild(card);
  });

  if (showAvatar) {
    const n = PERSON.first;
    $('profilePage').hidden = true;
    $('avatarPage').hidden = false;
    $('avatarThumb').src = PERSON.photo;
    $('avatarName').textContent = c.name;
    $('avatarSubtitle').textContent = c.subtitle;
    $('videoLabel').textContent = 'Live avatar of ' + n;
    // review=1 adds exactly one sentence; everything else in the disclosure is identical.
    $('disclosure').textContent =
      'An AI representation of ' + n + ', created with ' + n + '’s consent from the photos and profile content ' + n + ' uploaded. ' +
      (reviewed ? n + ' reviewed this avatar and explicitly approved it as a faithful representation of themselves. ' : '') +
      'It communicates the way ' + n + ' typically would, and answers using what is on ' + n + '’s profile. ' +
      'Your conversation is private; ' + n + ' will not know you interacted with it.';
    c.questions.forEach(q => { const b = document.createElement('button'); b.type = 'button'; b.className = 'suggestion'; b.textContent = q; $('suggestions').appendChild(b); });
  }

  $('ctaSecondary').innerHTML = isDating ? ICONS.pass : ICONS.save;
  $('ctaSecondary').setAttribute('aria-label', isDating ? 'Pass' : 'Save to shortlist');
  $('ctaPrimary').textContent = 'Message ' + PERSON.first;

  // Report rendered frame height to a parent page (used by index.html for review only).
  function reportHeight() {
    if (window.parent === window) return;
    const frame = $('frame');
    frame.style.minHeight = '0';   // measure natural content height, not the viewport
    const height = Math.round(frame.getBoundingClientRect().height);
    frame.style.minHeight = '';
    window.parent.postMessage({ stimulus: location.pathname.split('/').pop() + location.search, height }, '*');
  }
  window.addEventListener('load', reportHeight);
  if (document.fonts) document.fonts.ready.then(reportHeight);
  $('photo').addEventListener('load', reportHeight);
  $('avatarThumb').addEventListener('load', reportHeight);
</script>
</body>
</html>
